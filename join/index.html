<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Many Doves</title>
<meta property="og:title" content="You're invited to a Many Doves home base">
<meta property="og:description" content="Service details and a place to share memories.">
<style>
 body{margin:0;background:#F7F4EE;font-family:-apple-system,system-ui,sans-serif;color:#1F2A26;display:flex;min-height:100vh;align-items:center;justify-content:center}
 .card{background:#fff;border-radius:20px;padding:28px 22px;max-width:340px;width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
 .mark{font-size:13px;letter-spacing:3px;color:#B08A3E;font-weight:800}
 h1{font-size:24px;margin:10px 0 6px}
 p{font-size:16px;color:#55605B;margin:6px 0}
 .code{font-size:34px;font-weight:900;letter-spacing:5px;margin:14px 0}
 a.btn{display:block;background:#2F4A3F;color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:15px;border-radius:14px;margin-top:12px}
 a.alt{background:#fff;color:#2F4A3F;border:2px solid #2F4A3F}
 small{display:block;margin-top:16px;color:#8A928E;font-size:13px}
</style></head><body>
<div class="card">
 <div class="mark">MANY DOVES</div>
 <h1>You're invited</h1>
 <p>Tap below to open the home base in the Many Doves app.</p>
 <div class="code" id="code"></div>
 <a class="btn" id="open" href="#">Open in Many Doves</a>
 <a class="btn alt" id="expo" href="#">Testing? Open in Expo Go</a>
 <small>No app yet? Open Many Doves and enter the code above on the Home screen.</small>
</div>
<script>
 var q=new URLSearchParams(location.search), c=(q.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!c){var m=location.pathname.match(/join\/([A-Za-z0-9]+)/); if(m) c=m[1].toUpperCase();}
 document.getElementById('code').textContent=c;
 document.getElementById('open').href='manydoves://join/'+c;
 document.getElementById('expo').href='exp://u.expo.dev/eda446d8-deb9-4e67-b599-ecfa723d77a6/--/join/'+c+'?channel-name=preview&runtime-version=exposdk:57.0.0';
</script>
</body></html>
